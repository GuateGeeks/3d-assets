<title>Escuela Flat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root {
  --bg: #e9f1f6;
  --surface: rgba(251, 247, 238, 0.94);
  --surface-solid: #fbf7ee;
  --ink: #2f3a45;
  --ink-soft: #5b6672;
  --line: rgba(47, 58, 69, 0.16);
  --accent: #c8553d;
  --accent-ink: #ffffff;
  --sky: #4997d0;
  --grass: #9ccb6b;
  --wall: #f4e3c1;
  --chip: #f4e3c1;
  --chip-on: #2f3a45;
  --chip-on-ink: #fbf7ee;
  --focus: #4997d0;
  --shadow: 0 6px 22px rgba(47, 58, 69, 0.16);
  --label-bg: #2f3a45;
  --label-ink: #fbf7ee;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Verdana", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d242b;
    --surface: rgba(37, 45, 54, 0.94);
    --surface-solid: #252d36;
    --ink: #f1ece2;
    --ink-soft: #b7bec6;
    --line: rgba(241, 236, 226, 0.16);
    --accent: #e07a5f;
    --accent-ink: #1d242b;
    --chip: #333d48;
    --chip-on: #f4e3c1;
    --chip-on-ink: #2f3a45;
    --focus: #8ec5e8;
    --shadow: 0 6px 22px rgba(0, 0, 0, 0.4);
    --label-bg: #f4e3c1;
    --label-ink: #2f3a45;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d242b;
  --surface: rgba(37, 45, 54, 0.94);
  --surface-solid: #252d36;
  --ink: #f1ece2;
  --ink-soft: #b7bec6;
  --line: rgba(241, 236, 226, 0.16);
  --accent: #e07a5f;
  --accent-ink: #1d242b;
  --chip: #333d48;
  --chip-on: #f4e3c1;
  --chip-on-ink: #2f3a45;
  --focus: #8ec5e8;
  --shadow: 0 6px 22px rgba(0, 0, 0, 0.4);
  --label-bg: #f4e3c1;
  --label-ink: #2f3a45;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#stage { position: absolute; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; }
#stage.hovering { cursor: pointer; }

/* Etiquetas proyectadas */
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
#labels[hidden] { display: none; }
.pin {
  position: absolute; left: 0; top: 0;
  min-width: 24px; height: 24px; padding: 0 6px;
  border: 2px solid var(--surface-solid);
  border-radius: 12px;
  background: var(--label-bg); color: var(--label-ink);
  font: 700 12px/20px var(--font-body);
  text-align: center;
  pointer-events: auto; cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
  will-change: transform;
  transition: background .15s, color .15s;
}
.pin span.name { display: none; margin-left: 4px; font-weight: 400; white-space: nowrap; }
.pin:hover span.name, .pin.on span.name, .pin:focus-visible span.name { display: inline; }
.pin.on { background: var(--accent); color: var(--accent-ink); }
.pin.off-screen, .pin.under-ui { visibility: hidden; }

/* Capa de UI */
.ui {
  position: absolute; inset: 0; pointer-events: none; z-index: 2;
  padding-top: max(14px, env(safe-area-inset-top, 0px));
  padding-bottom: max(14px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.ui > * { pointer-events: auto; }
.brand {
  position: absolute;
  top: max(14px, env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  max-width: calc(100% - 32px - 340px);
  background: var(--surface); border-radius: 12px; box-shadow: var(--shadow);
  padding: 8px 14px 9px;
}
.brand h1 { margin: 0; font: 700 19px/1.15 var(--font-display); letter-spacing: -0.01em; }
.brand p { margin: 2px 0 0; color: var(--ink-soft); font-size: 13px; }
.brand .swatch { display: inline-flex; gap: 3px; margin-right: 6px; vertical-align: 1px; }
.brand .swatch i { width: 8px; height: 8px; display: block; transform: rotate(45deg); }

.toolbar {
  display: flex; justify-content: space-between; gap: 4px; padding: 5px;
  background: var(--surface); border-radius: 12px; box-shadow: var(--shadow);
}
.tool {
  appearance: none; border: 0; background: transparent; color: var(--ink);
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  flex: 1 1 0; min-width: 0; height: 48px; padding: 4px 2px; border-radius: 9px;
  font: 700 11px/1 var(--font-body); cursor: pointer;
}
.tool svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tool:hover { background: var(--line); }
.tool[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); }
.tool .speed-val { font: 700 15px/20px var(--font-display); height: 20px; }
button:focus-visible, .pin:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.panel {
  position: absolute;
  right: max(16px, env(safe-area-inset-right, 0px));
  top: max(14px, env(safe-area-inset-top, 0px));
  bottom: max(14px, env(safe-area-inset-bottom, 0px));
  width: 320px;
  display: flex; flex-direction: column; gap: 10px;
  pointer-events: none;
}
.panel > * { pointer-events: auto; }
.box { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; }
.box h2 { margin: 0 0 8px; font: 700 13px/1.2 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  appearance: none; border: 1px solid transparent; cursor: pointer;
  background: var(--chip); color: var(--ink);
  border-radius: 999px; padding: 5px 10px 5px 5px;
  font: 400 13px/1.2 var(--font-body);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.chip b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--surface-solid); font-size: 11px; color: var(--ink); }
.chip:hover { border-color: var(--line); }
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); }
.chip[aria-pressed="true"] b { background: var(--accent); color: var(--accent-ink); }

.card[hidden] { display: none; }
.card .head { display: flex; align-items: flex-start; gap: 10px; }
.card .num { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font: 700 15px/1 var(--font-display); }
.card h3 { margin: 2px 0 0; font: 700 20px/1.15 var(--font-display); flex: 1; }
.card p { margin: 8px 0 0; }
.card .meta { margin-top: 6px; color: var(--ink-soft); font-size: 13px; }
.card .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn {
  appearance: none; cursor: pointer; border-radius: 9px; padding: 8px 12px;
  font: 700 13px/1 var(--font-body);
  border: 1px solid var(--line); background: transparent; color: var(--ink);
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.icon-btn { appearance: none; border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--line); }
.icon-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; }
details.notes summary { cursor: pointer; font: 700 13px/1.2 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
details.notes ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink-soft); font-size: 13px; }
.spacer { flex: 1; }

.status {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  max-width: min(360px, calc(100% - 32px));
  background: var(--surface); border-radius: 14px; box-shadow: var(--shadow);
  padding: 18px 20px; text-align: center;
}
.status[hidden] { display: none; }
.status strong { display: block; font: 700 18px/1.2 var(--font-display); }
.status span { display: block; margin-top: 4px; color: var(--ink-soft); font-size: 14px; }
.status .bar { height: 4px; margin-top: 12px; border-radius: 2px; background: var(--line); overflow: hidden; }
.status .bar i { display: block; height: 100%; width: 35%; background: var(--sky); animation: slide 1.1s ease-in-out infinite; }
.status.error .bar { display: none; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Móvil: hoja inferior */
@media (max-width: 760px) {
  .brand { padding: 6px 12px 7px; right: max(16px, env(safe-area-inset-right, 0px)); max-width: none; }
  .brand h1 { font-size: 17px; }
  .brand p { display: none; }
  .panel {
    left: 0; right: 0; top: auto; bottom: 0; width: auto;
    gap: 0;
    background: var(--surface); box-shadow: var(--shadow);
    border-radius: 16px 16px 0 0;
    padding-top: 8px;
    padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    max-height: 52%;
  }
  .panel .box { background: transparent; box-shadow: none; padding: 6px 0; border-radius: 0; }
  .toolbar {
    box-shadow: none; background: transparent; padding: 0 0 4px;
    justify-content: space-between; gap: 2px;
  }
  .tool { min-width: 0; flex: 1; height: 46px; padding: 3px 2px; font-size: 10px; }
  .parts-box h2, details.notes { display: none; }
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px; margin: 0 -2px; }
  .chips::-webkit-scrollbar { display: none; }
  .card { border-top: 1px solid var(--line) !important; overflow-y: auto; min-height: 0; }
  .card h3 { font-size: 18px; }
  .spacer { display: none; }
  .pin { min-width: 20px; height: 20px; border-radius: 10px; font-size: 10px; line-height: 16px; padding: 0 4px; opacity: .9; }
  .pin span.name { display: none !important; }
}
@media (prefers-reduced-motion: reduce) {
  .status .bar i { animation: none; width: 100%; }
  .pin, .tool, .chip { transition: none; }
}
</style>

<div id="app">
  <div id="stage" aria-label="Vista 3D del diorama de la escuela. Arrastra para girar, pellizca o usa la rueda para acercar." role="img"></div>
  <div id="labels" aria-hidden="false"></div>

  <div class="ui">
    <header class="brand">
      <h1><span class="swatch" aria-hidden="true"><i style="background:#9ccb6b"></i><i style="background:#c8553d"></i><i style="background:#4997d0"></i></span><span id="title">Escuela Flat</span></h1>
      <p>Toca una estructura para conocerla.</p>
    </header>

    <aside class="panel" id="panel">
      <div class="toolbar" role="toolbar" aria-label="Controles de la vista">
        <button class="tool" id="btnReset" type="button" title="Restablecer vista">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>Vista
        </button>
        <button class="tool" id="btnLabels" type="button" aria-pressed="true" title="Mostrar u ocultar etiquetas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>Etiquetas
        </button>
        <button class="tool" id="btnNight" type="button" aria-pressed="false" title="Cambiar entre día y noche">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span id="nightTxt">Noche</span>
        </button>
        <button class="tool" id="btnPause" type="button" aria-pressed="false" title="Pausar o reanudar animaciones">
          <svg viewBox="0 0 24 24" aria-hidden="true" id="pauseIcon"><path d="M9 5v14M15 5v14"/></svg><span id="pauseTxt">Pausa</span>
        </button>
        <button class="tool" id="btnSpeed" type="button" title="Velocidad de las animaciones" aria-label="Velocidad: 1×">
          <span class="speed-val" id="speedVal" aria-hidden="true">1×</span>Velocidad
        </button>
        <button class="tool" id="btnSpin" type="button" aria-pressed="false" title="Giro automático de la cámara">
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="13" rx="9" ry="4"/><path d="M12 4v5"/><path d="M17 15.5l2.5 1.5-1 2.5"/></svg>Giro
        </button>
      </div>

      <section class="box parts-box" aria-labelledby="partsTitle">
        <h2 id="partsTitle">Partes de la escuela</h2>
        <div class="chips" id="chips" role="group" aria-label="Partes de la escuela"></div>
      </section>

      <section class="box card" id="card" hidden aria-live="polite">
        <div class="head">
          <span class="num" id="cardNum">1</span>
          <h3 id="cardTitle"></h3>
          <button class="icon-btn" id="cardClose" type="button" aria-label="Cerrar tarjeta y deseleccionar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <p id="cardText"></p>
        <div class="meta" id="cardMeta"></div>
        <div class="actions" id="cardActions"></div>
      </section>

      <div class="spacer"></div>
      <details class="box notes" id="notesBox" hidden>
        <summary>Notas de diseño</summary>
        <ul id="notes"></ul>
      </details>
    </aside>

    <div class="status" id="status" role="status">
      <strong id="statusTitle">Cargando la escuela…</strong>
      <span id="statusText">Preparando el modelo 3D.</span>
      <div class="bar"><i></i></div>
    </div>
  </div>
  <p class="sr-only" id="announce" aria-live="polite"></p>
</div>

<script>
  // Si los módulos no arrancan (CDN bloqueado), mostramos un estado claro.
  window.__schoolBootTimer = setTimeout(function () {
    if (window.__schoolBooted) return;
    var s = document.getElementById('status');
    if (!s) return;
    s.hidden = false; s.className = 'status error';
    document.getElementById('statusTitle').textContent = 'Modelo no disponible';
    document.getElementById('statusText').textContent = 'No se pudo cargar el visor 3D (three.js). Revisa la conexión y recarga la página.';
  }, 12000);
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

window.__schoolBooted = true;

const $ = (id) => document.getElementById(id);
const DATA = (window.SCHOOL && typeof window.SCHOOL === 'object') ? window.SCHOOL : null;
const reduceMotionMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
const narrowMQ = window.matchMedia('(max-width: 760px)');
let reduceMotion = reduceMotionMQ.matches;

/* ---------- Estado ---------- */
const state = {
  parts: [],              // {id,label,function,num,pos:Vector3|null,meshes:[],clip:null}
  partById: new Map(),
  selected: null,
  hovered: null,
  night: false,
  paused: false,
  speedIdx: 1,
  labels: !narrowMQ.matches,
  autoSpin: false,
  modelReady: false,
};
const SPEEDS = [0.5, 1, 2];

function setStatus(title, text, isError) {
  const s = $('status');
  if (!title) { s.hidden = true; return; }
  s.hidden = false;
  s.className = 'status' + (isError ? ' error' : '');
  $('statusTitle').textContent = title;
  $('statusText').textContent = text || '';
}
function announce(msg) { $('announce').textContent = msg; }

/* ---------- Partes desde los datos ---------- */
function vec3OrNull(a) {
  if (!Array.isArray(a) || a.length < 3) return null;
  const v = a.slice(0, 3).map(Number);
  return v.every(Number.isFinite) ? new THREE.Vector3(v[0], v[1], v[2]) : null;
}
const clipsCfg = (DATA && DATA.clips && typeof DATA.clips === 'object') ? DATA.clips : {};
(Array.isArray(DATA && DATA.parts) ? DATA.parts : []).forEach((p, i) => {
  if (!p || typeof p.id !== 'string' || state.partById.has(p.id)) return;
  const part = {
    id: p.id,
    label: String(p.label || p.id),
    fn: String(p.function || ''),
    num: state.parts.length + 1,
    pos: vec3OrNull(p.positionGltf),
    meshes: [],
    clickClip: null,
    loopClips: [],
  };
  state.parts.push(part);
  state.partById.set(part.id, part);
});
for (const [name, cfg] of Object.entries(clipsCfg)) {
  for (const pid of (cfg && Array.isArray(cfg.parts) ? cfg.parts : [])) {
    const part = state.partById.get(pid);
    if (!part) continue;
    if (cfg.trigger === 'click' && !part.clickClip) part.clickClip = name;
    else if (cfg.autoplay) part.loopClips.push(name);
  }
}
if (DATA && typeof DATA.title === 'string' && DATA.title.trim()) {
  $('title').textContent = DATA.title.trim();
}
if (DATA && Array.isArray(DATA.designNotes) && DATA.designNotes.length) {
  const ul = $('notes');
  DATA.designNotes.slice(0, 12).forEach((n) => {
    const li = document.createElement('li'); li.textContent = String(n); ul.appendChild(li);
  });
  $('notesBox').hidden = false;
}

/* ---------- Escena ---------- */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
renderer.domElement.setAttribute('tabindex', '-1');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.005, 60);
camera.position.set(0.35, 0.3, 0.5);

// Cielo con degradado sencillo
const SKY = {
  day:   { top: new THREE.Color('#4f9fd8'), mid: new THREE.Color('#bfe0f2'), bottom: new THREE.Color('#e3edf0') },
  night: { top: new THREE.Color('#0d1626'), mid: new THREE.Color('#22324a'), bottom: new THREE.Color('#1c2433') },
};
const skyUniforms = {
  uTop: { value: SKY.day.top.clone() },
  uMid: { value: SKY.day.mid.clone() },
  uBottom: { value: SKY.day.bottom.clone() },
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(30, 24, 12),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: skyUniforms,
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 uTop; uniform vec3 uMid; uniform vec3 uBottom; varying vec3 vP; void main(){ float h = vP.y; vec3 c = h > 0.0 ? mix(uMid, uTop, smoothstep(0.0, 0.6, h)) : mix(uMid, uBottom, smoothstep(0.0, 0.35, -h)); gl_FragColor = vec4(c, 1.0); }',
  })
);
sky.renderOrder = -1;
sky.frustumCulled = false;
scene.add(sky);

const LIGHT = {
  day:   { hemiSky: '#dff0ff', hemiGround: '#b9a27f', hemi: 1.35, sun: '#fff3dc', sunI: 2.1 },
  night: { hemiSky: '#5a6f9e', hemiGround: '#2a2630', hemi: 0.45, sun: '#a9bde6', sunI: 0.45 },
};
const hemi = new THREE.HemisphereLight(LIGHT.day.hemiSky, LIGHT.day.hemiGround, LIGHT.day.hemi);
scene.add(hemi);
const sun = new THREE.DirectionalLight(LIGHT.day.sun, LIGHT.day.sunI);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.radius = 4;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.002;
scene.add(sun, sun.target);

// Sombra de "mesa" bajo el diorama
const shadowCatcher = new THREE.Mesh(
  new THREE.CircleGeometry(1, 40),
  new THREE.ShadowMaterial({ opacity: 0.22, transparent: true })
);
shadowCatcher.rotation.x = -Math.PI / 2;
shadowCatcher.receiveShadow = true;
shadowCatcher.visible = false;
scene.add(shadowCatcher);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.46;
controls.minPolarAngle = 0.05;
controls.autoRotateSpeed = 0.9;
controls.screenSpacePanning = true;
controls.zoomToCursor = false;

/* ---------- Encaje de vista (descuenta UI que tapa) ---------- */
const bounds = {
  box: new THREE.Box3(new THREE.Vector3(-0.2, -0.056, -0.15), new THREE.Vector3(0.2, 0.135, 0.15)),
  center: new THREE.Vector3(0, 0.01, 0),
  radius: 0.26,
  groundY: -0.04,
};
const view = { w: 1, h: 1, visW: 1, visH: 1, fullW: 1, fullH: 1 };

function occlusion() {
  const panel = $('panel');
  const r = stage.getBoundingClientRect();
  const out = { left: 0, right: 0, top: 0, bottom: 0 };
  if (!panel) return out;
  const p = panel.getBoundingClientRect();
  if (narrowMQ.matches) {
    out.bottom = Math.max(0, r.bottom - p.top);
    const b = document.querySelector('.brand').getBoundingClientRect();
    out.top = Math.max(0, b.bottom - r.top + 4);
  } else {
    out.right = Math.max(0, r.right - p.left + 8);
  }
  // No dejar menos del 45% útil
  out.bottom = Math.min(out.bottom, r.height * 0.55);
  out.right = Math.min(out.right, r.width * 0.5);
  return out;
}

function updateViewport() {
  const w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight);
  renderer.setSize(w, h, false);
  const o = occlusion();
  const dx = (o.left - o.right) / 2, dy = (o.top - o.bottom) / 2;
  const fullW = w + 2 * Math.abs(dx), fullH = h + 2 * Math.abs(dy);
  const offX = dx < 0 ? 2 * Math.abs(dx) : 0;
  const offY = dy < 0 ? 2 * Math.abs(dy) : 0;
  camera.aspect = fullW / fullH;
  camera.setViewOffset(fullW, fullH, offX, offY, w, h);
  camera.updateProjectionMatrix();
  Object.assign(view, { w, h, fullW, fullH, visW: w - o.left - o.right, visH: h - o.top - o.bottom });
  // Zoom acotado: permite alejarse lo suficiente para ver todo en pantallas estrechas
  controls.minDistance = bounds.radius * 0.35;
  controls.maxDistance = Math.max(bounds.radius * 4.5, fitDistance(bounds.radius) * 1.6);
}

function fitDistance(radius) {
  const v = THREE.MathUtils.degToRad(camera.fov / 2);
  const tanV = Math.tan(v) * (view.visH / view.fullH);
  const tanH = Math.tan(v) * camera.aspect * (view.visW / view.fullW);
  const half = Math.atan(Math.max(1e-3, Math.min(tanV, tanH)));
  return radius / Math.sin(half);
}

function homePose() {
  const d = fitDistance(bounds.radius) * (camera.aspect * view.visW / view.fullW < 0.9 ? 0.97 : 0.92);
  const az = THREE.MathUtils.degToRad(32), el = THREE.MathUtils.degToRad(30);
  const target = bounds.center.clone();
  const pos = new THREE.Vector3(
    Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)
  ).multiplyScalar(d).add(target);
  return { target, pos };
}

/* ---------- Transición de cámara ---------- */
let camTween = null;
function flyTo(target, pos, duration = 0.9) {
  if (reduceMotion || duration <= 0) {
    controls.target.copy(target); camera.position.copy(pos); controls.update(); camTween = null; return;
  }
  camTween = {
    t: 0, dur: duration,
    fromT: controls.target.clone(), toT: target.clone(),
    fromP: camera.position.clone(), toP: pos.clone(),
  };
}
function stepTween(dt) {
  if (!camTween) return;
  camTween.t = Math.min(1, camTween.t + dt / camTween.dur);
  const k = camTween.t < 0.5 ? 4 * camTween.t ** 3 : 1 - (-2 * camTween.t + 2) ** 3 / 2;
  controls.target.lerpVectors(camTween.fromT, camTween.toT, k);
  camera.position.lerpVectors(camTween.fromP, camTween.toP, k);
  if (camTween.t >= 1) camTween = null;
}
controls.addEventListener('start', () => { camTween = null; });

function resetView() {
  const { target, pos } = homePose();
  flyTo(target, pos, 1.0);
}

function clampControls() {
  const b = bounds.box;
  const t = controls.target;
  t.x = THREE.MathUtils.clamp(t.x, b.min.x, b.max.x);
  t.z = THREE.MathUtils.clamp(t.z, b.min.z, b.max.z);
  t.y = THREE.MathUtils.clamp(t.y, bounds.groundY, b.max.y);
  const minY = bounds.groundY + 0.012;
  if (camera.position.y < minY) camera.position.y = minY;
}

/* ---------- Materiales y estado visual ---------- */
const HILITE = new THREE.Color('#ffb347');
const _tint = new THREE.Color();
const GLASS_NIGHT = new THREE.Color('#ffc46b');
const allMeshes = [];

function prepareMaterial(m) {
  const mat = m.clone();
  if ('flatShading' in mat) mat.flatShading = true;
  mat.userData.baseEmissive = mat.emissive ? mat.emissive.clone() : null;
  mat.userData.baseEmissiveIntensity = mat.emissiveIntensity ?? 1;
  mat.userData.isGlass = /flat_vidrio/i.test(m.name || '');
  mat.needsUpdate = true;
  return mat;
}

function applyMeshLook(mesh) {
  const part = mesh.userData.__part;
  const sel = part && state.selected === part;
  const hov = part && state.hovered === part && !sel;
  const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
  for (const mat of mats) {
    if (!mat || !mat.emissive) continue;
    const base = mat.userData.baseEmissive || new THREE.Color(0, 0, 0);
    if (mat.userData.isGlass && state.night) {
      mat.emissive.copy(GLASS_NIGHT); mat.emissiveIntensity = 0.95;
    } else {
      mat.emissive.copy(base); mat.emissiveIntensity = mat.userData.baseEmissiveIntensity;
    }
    if (sel || hov) {
      // Tinte emisivo suave, sumado al estado base
      const amt = sel ? 0.22 : 0.1;
      mat.emissive.multiplyScalar(mat.emissiveIntensity).add(_tint.copy(HILITE).multiplyScalar(amt));
      mat.emissiveIntensity = 1;
    }
  }
}
function refreshLooks(parts) {
  const list = parts ? parts.filter(Boolean).flatMap((p) => p.meshes) : allMeshes;
  list.forEach(applyMeshLook);
}

/* ---------- Animación ---------- */
let mixer = null;
const actions = new Map();
const doorState = new Map(); // clip -> abierto?

function setupAnimations(root, clips) {
  if (!clips || !clips.length) return;
  mixer = new THREE.AnimationMixer(root);
  const configured = Object.keys(clipsCfg).length > 0;
  for (const clip of clips) {
    const action = mixer.clipAction(clip);
    actions.set(clip.name, action);
    const cfg = clipsCfg[clip.name];
    const isTrigger = cfg ? cfg.trigger === 'click' : clip.name === 'puerta';
    const auto = cfg ? !!cfg.autoplay && !isTrigger : (!configured && !isTrigger);
    if (isTrigger) {
      action.setLoop(THREE.LoopOnce, 1);
      action.clampWhenFinished = true;
      doorState.set(clip.name, false);
    } else if (auto) {
      action.setLoop(THREE.LoopRepeat, Infinity);
      action.play();
    }
  }
  mixer.timeScale = SPEEDS[state.speedIdx];
}

function toggleClip(name) {
  const action = actions.get(name);
  if (!action) { announce('Esta animación no está disponible en el modelo.'); return false; }
  const open = !doorState.get(name);
  doorState.set(name, open);
  action.paused = false;
  action.timeScale = open ? 1 : -1;
  if (!action.isScheduled()) {
    if (!open) action.time = action.getClip().duration;
    action.play();
  }
  if (state.paused) setPaused(false);
  announce(open ? 'Abriendo la puerta.' : 'Cerrando la puerta.');
  renderCard();
  return true;
}

function setPaused(p) {
  state.paused = p;
  $('btnPause').setAttribute('aria-pressed', String(p));
  $('pauseTxt').textContent = p ? 'Seguir' : 'Pausa';
  $('pauseIcon').innerHTML = p ? '<path d="M8 5l11 7-11 7z"/>' : '<path d="M9 5v14M15 5v14"/>';
  announce(p ? 'Animaciones en pausa.' : 'Animaciones reanudadas.');
}
function setSpeed(idx) {
  state.speedIdx = (idx + SPEEDS.length) % SPEEDS.length;
  const s = SPEEDS[state.speedIdx];
  const txt = (s === 0.5 ? '0,5' : String(s)) + '×';
  $('speedVal').textContent = txt;
  $('btnSpeed').setAttribute('aria-label', 'Velocidad: ' + txt + '. Pulsa para cambiar.');
  if (mixer) mixer.timeScale = s;
  announce('Velocidad ' + txt);
}

/* ---------- Día / noche ---------- */
function setNight(n) {
  state.night = n;
  const S = n ? SKY.night : SKY.day, L = n ? LIGHT.night : LIGHT.day;
  skyUniforms.uTop.value.copy(S.top); skyUniforms.uMid.value.copy(S.mid); skyUniforms.uBottom.value.copy(S.bottom);
  hemi.color.set(L.hemiSky); hemi.groundColor.set(L.hemiGround); hemi.intensity = L.hemi;
  sun.color.set(L.sun); sun.intensity = L.sunI;
  placeSun();
  shadowCatcher.material.opacity = n ? 0.12 : 0.22;
  $('btnNight').setAttribute('aria-pressed', String(n));
  $('nightTxt').textContent = n ? 'Día' : 'Noche';
  refreshLooks();
  announce(n ? 'Modo noche: las ventanas se iluminan.' : 'Modo día.');
}
function placeSun() {
  const r = bounds.radius;
  const dir = state.night ? new THREE.Vector3(-0.5, 1.0, 0.35) : new THREE.Vector3(0.55, 1.0, 0.45);
  sun.position.copy(bounds.center).addScaledVector(dir.normalize(), r * 3);
  sun.target.position.copy(bounds.center);
  const sc = sun.shadow.camera;
  sc.left = -r * 1.25; sc.right = r * 1.25; sc.top = r * 1.25; sc.bottom = -r * 1.25;
  sc.near = r * 0.5; sc.far = r * 6;
  sc.updateProjectionMatrix();
}

/* ---------- UI: chips, etiquetas, tarjeta ---------- */
const chipsEl = $('chips'), labelsEl = $('labels');
const pinEls = new Map(), chipEls = new Map();

function buildPartUI() {
  chipsEl.textContent = ''; labelsEl.textContent = '';
  for (const part of state.parts) {
    const chip = document.createElement('button');
    chip.type = 'button'; chip.className = 'chip';
    chip.setAttribute('aria-pressed', 'false');
    chip.innerHTML = '<b aria-hidden="true"></b><span></span>';
    chip.querySelector('b').textContent = part.num;
    chip.querySelector('span').textContent = part.label;
    chip.addEventListener('click', () => selectPart(state.selected === part ? null : part, { focus: true }));
    chipsEl.appendChild(chip); chipEls.set(part.id, chip);

    const pin = document.createElement('button');
    pin.type = 'button'; pin.className = 'pin off-screen'; pin.tabIndex = -1;
    pin.setAttribute('aria-label', part.num + '. ' + part.label);
    pin.innerHTML = '<span class="n"></span><span class="name"></span>';
    pin.querySelector('.n').textContent = part.num;
    pin.querySelector('.name').textContent = part.label;
    pin.addEventListener('click', (e) => { e.stopPropagation(); selectPart(part, { focus: true }); });
    labelsEl.appendChild(pin); pinEls.set(part.id, pin);
  }
  applyLabelsVisible();
}

function applyLabelsVisible() {
  labelsEl.hidden = !state.labels;
  $('btnLabels').setAttribute('aria-pressed', String(state.labels));
}

function renderCard() {
  const card = $('card'), part = state.selected;
  if (!part) { card.hidden = true; return; }
  card.hidden = false;
  $('cardNum').textContent = part.num;
  $('cardTitle').textContent = part.label;
  $('cardText').textContent = part.fn || 'Sin descripción.';
  const meta = [];
  if (!part.meshes.length && state.modelReady) meta.push('No se encontró esta parte en el modelo.');
  const loops = part.loopClips.filter((c) => actions.has(c));
  if (loops.length) meta.push('Tiene movimiento propio en bucle.');
  $('cardMeta').textContent = meta.join(' ');
  const act = $('cardActions'); act.textContent = '';
  if (part.clickClip) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn primary';
    const open = !!doorState.get(part.clickClip);
    const isDoor = part.id === 'puerta' || part.clickClip === 'puerta';
    b.textContent = isDoor ? (open ? 'Cerrar puerta' : 'Abrir puerta') : (open ? 'Revertir' : 'Animar');
    b.disabled = !actions.has(part.clickClip);
    b.addEventListener('click', () => toggleClip(part.clickClip));
    act.appendChild(b);
  }
  if (part.pos || part.meshes.length) {
    const f = document.createElement('button');
    f.type = 'button'; f.className = 'btn';
    f.textContent = 'Enfocar';
    f.addEventListener('click', () => focusPart(part));
    act.appendChild(f);
  }
}

function partCenter(part) {
  if (part.__labelCur) return part.__labelCur.clone();
  if (part.pos) return part.pos.clone();
  if (part.meshes.length) {
    const b = new THREE.Box3();
    part.meshes.forEach((m) => b.expandByObject(m));
    return b.getCenter(new THREE.Vector3());
  }
  return null;
}
function partRadius(part) {
  if (!part.meshes.length) return bounds.radius * 0.3;
  const b = new THREE.Box3();
  part.meshes.forEach((m) => b.expandByObject(m));
  return Math.max(0.03, b.getBoundingSphere(new THREE.Sphere()).radius);
}

function focusPart(part) {
  const c = partCenter(part);
  if (!c) return;
  c.y = Math.max(c.y, bounds.groundY);
  const dir = camera.position.clone().sub(controls.target);
  if (dir.lengthSq() < 1e-8) dir.set(0.5, 0.5, 0.7);
  dir.normalize();
  if (dir.y < 0.35) { dir.y = 0.35; dir.normalize(); }
  const d = THREE.MathUtils.clamp(fitDistance(Math.max(partRadius(part), bounds.radius * 0.3)) * 1.1, controls.minDistance * 1.05, controls.maxDistance * 0.8);
  flyTo(c, c.clone().addScaledVector(dir, d), 0.9);
}

function selectPart(part, opts = {}) {
  const prev = state.selected;
  state.selected = part || null;
  for (const [id, chip] of chipEls) chip.setAttribute('aria-pressed', String(!!part && id === part.id));
  for (const [id, pin] of pinEls) pin.classList.toggle('on', !!part && id === part.id);
  refreshLooks([prev, part]);
  renderCard();
  if (part) {
    announce(part.num + '. ' + part.label + '. ' + part.fn);
    if (opts.focus !== false) focusPart(part);
    const chip = chipEls.get(part.id);
    if (chip && narrowMQ.matches) chip.scrollIntoView({ block: 'nearest', inline: 'center', behavior: reduceMotion ? 'auto' : 'smooth' });
  }
  requestAnimationFrame(updateViewport);
}

/* ---------- Picking ---------- */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let pickables = [];

function pickAt(clientX, clientY) {
  if (!pickables.length) return null;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  for (const h of hits) {
    if (h.object.userData.__part) return h.object.userData.__part;
  }
  return null;
}

let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => {
  down = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId };
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || down.id !== e.pointerId) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  const dt = performance.now() - down.t;
  down = null;
  if (moved > 6 || dt > 700) return;
  const part = pickAt(e.clientX, e.clientY);
  if (!part) { if (state.selected) selectPart(null); return; }
  if (part.clickClip && (state.selected === part || part.id === 'puerta')) {
    toggleClip(part.clickClip);
    if (state.selected !== part) selectPart(part, { focus: false });
    return;
  }
  selectPart(part, { focus: true });
});

let hoverPending = null;
renderer.domElement.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse' || e.buttons) return;
  hoverPending = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('pointerleave', () => { hoverPending = null; setHover(null); });
function setHover(part) {
  if (state.hovered === part) return;
  const prev = state.hovered;
  state.hovered = part;
  stage.classList.toggle('hovering', !!part);
  refreshLooks([prev, part]);
}

/* ---------- Botones ---------- */
$('btnReset').addEventListener('click', () => { selectPart(null); resetView(); });
$('btnLabels').addEventListener('click', () => { state.labels = !state.labels; applyLabelsVisible(); });
$('btnNight').addEventListener('click', () => setNight(!state.night));
$('btnPause').addEventListener('click', () => setPaused(!state.paused));
$('btnSpeed').addEventListener('click', () => setSpeed(state.speedIdx + 1));
$('btnSpin').addEventListener('click', () => setAutoSpin(!state.autoSpin));
$('cardClose').addEventListener('click', () => selectPart(null));
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.selected) selectPart(null);
});
function setAutoSpin(on) {
  state.autoSpin = !!on && !reduceMotion;
  controls.autoRotate = state.autoSpin;
  $('btnSpin').setAttribute('aria-pressed', String(state.autoSpin));
  $('btnSpin').disabled = reduceMotion;
  $('btnSpin').title = reduceMotion ? 'Giro automático desactivado por la preferencia de movimiento reducido' : 'Giro automático de la cámara';
}
reduceMotionMQ.addEventListener?.('change', (e) => { reduceMotion = e.matches; setAutoSpin(state.autoSpin); });
narrowMQ.addEventListener?.('change', () => requestAnimationFrame(updateViewport));

/* ---------- Bucle ---------- */
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();

// Ancla de etiqueta animada: posición de reposo + mediana del desplazamiento
// de las mallas de la parte (sigue a bus/estudiantes/nubes; ignora piezas
// minoritarias que se mueven dentro de una parte estática, p. ej. el balón).
const _wp = new THREE.Vector3();
const _dx = [], _dy = [], _dz = [];
function median(a) {
  a.sort((p, q) => p - q);
  const m = a.length >> 1;
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}
function captureRestAnchors() {
  for (const part of state.parts) {
    part.__rest = part.meshes.map((m) => m.getWorldPosition(new THREE.Vector3()));
    if (part.__labelPos) part.__labelCur = part.__labelPos.clone();
  }
}
function updateAnchors() {
  for (const part of state.parts) {
    if (!part.__labelCur || !part.__rest || !part.__rest.length) continue;
    _dx.length = _dy.length = _dz.length = 0;
    for (let i = 0; i < part.meshes.length; i++) {
      part.meshes[i].getWorldPosition(_wp).sub(part.__rest[i]);
      _dx.push(_wp.x); _dy.push(_wp.y); _dz.push(_wp.z);
    }
    part.__labelCur.set(
      part.__labelPos.x + median(_dx), part.__labelPos.y + median(_dy), part.__labelPos.z + median(_dz));
  }
}

// Rectángulos de la UI (coordenadas del escenario) bajo los que se ocultan etiquetas
function uiRects() {
  const sel = narrowMQ.matches
    ? ['.brand', '.panel', '.status:not([hidden])']
    : ['.brand', '.toolbar', '.parts-box', '.card:not([hidden])', '.notes:not([hidden])', '.status:not([hidden])'];
  const s = stage.getBoundingClientRect();
  const out = [];
  for (const q of sel) {
    const el = document.querySelector(q);
    if (!el) continue;
    const r = el.getBoundingClientRect();
    if (r.width && r.height) out.push({ l: r.left - s.left - 4, r: r.right - s.left + 4, t: r.top - s.top - 4, b: r.bottom - s.top + 4 });
  }
  return out;
}

function updateLabels() {
  if (!state.labels) return;
  const w = view.w, h = view.h;
  const rects = uiRects();
  for (const part of state.parts) {
    const pin = pinEls.get(part.id);
    const c = part.__labelCur || part.__labelPos;
    if (!pin || !c) { if (pin) pin.classList.add('off-screen'); continue; }
    tmp.copy(c).project(camera);
    const vis = tmp.z > -1 && tmp.z < 1 && Math.abs(tmp.x) < 1.05 && Math.abs(tmp.y) < 1.05;
    pin.classList.toggle('off-screen', !vis);
    if (!vis) continue;
    const x = (tmp.x * 0.5 + 0.5) * w, y = (-tmp.y * 0.5 + 0.5) * h;
    const pw = pin.offsetWidth || 24, ph = pin.offsetHeight || 24;
    const under = rects.some((r) => x + pw / 2 > r.l && x - pw / 2 < r.r && y > r.t && y - ph < r.b);
    pin.classList.toggle('under-ui', under);
    if (under) continue;
    pin.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -100%)`;
    pin.style.zIndex = String(1000 - Math.round(tmp.z * 500));
  }
}

let frames = 0;
function frame() {
  frames++;
  const dt = Math.min(clock.getDelta(), 0.1);
  if (mixer && !state.paused) mixer.update(dt);
  if (state.modelReady) updateAnchors();
  stepTween(dt);
  controls.update(dt);
  clampControls();
  if (hoverPending) {
    setHover(pickAt(hoverPending.x, hoverPending.y));
    hoverPending = null;
  }
  renderer.render(scene, camera);
  updateLabels();
}

let running = false;
function startLoop() { if (running) return; running = true; clock.getDelta(); renderer.setAnimationLoop(frame); }
function stopLoop() { running = false; renderer.setAnimationLoop(null); }
document.addEventListener('visibilitychange', () => { if (document.hidden) stopLoop(); else startLoop(); });

new ResizeObserver(() => updateViewport()).observe(stage);
new ResizeObserver(() => updateViewport()).observe($('panel'));

/* ---------- Carga del GLB ---------- */
function partIdOf(obj) {
  for (let o = obj; o; o = o.parent) {
    const pid = o.userData && (o.userData.part_id ?? o.userData.partId);
    if (typeof pid === 'string' && pid) return pid;
  }
  return null;
}

function dataUriToArrayBuffer(uri) {
  const comma = uri.indexOf(',');
  if (comma < 0) throw new Error('URI de datos inválida');
  const meta = uri.slice(0, comma), body = uri.slice(comma + 1);
  if (!/;base64/i.test(meta)) return new TextEncoder().encode(decodeURIComponent(body)).buffer;
  const bin = atob(body);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out.buffer;
}

function onModel(gltf) {
  const root = gltf.scene || (gltf.scenes && gltf.scenes[0]);
  if (!root) throw new Error('El GLB no contiene escena');
  scene.add(root);
  root.updateMatrixWorld(true);
  const unknown = new Set();
  root.traverse((o) => {
    if (!o.isMesh) return;
    // Las nubes no proyectan ni reciben sombra (evita su sombra oscura sobre el terreno)
    const noShadow = partIdOf(o) === 'nubes';
    o.castShadow = !noShadow; o.receiveShadow = !noShadow;
    o.material = Array.isArray(o.material) ? o.material.map(prepareMaterial) : prepareMaterial(o.material);
    allMeshes.push(o);
    const pid = partIdOf(o);
    const part = pid && state.partById.get(pid);
    if (part) { o.userData.__part = part; part.meshes.push(o); pickables.push(o); }
    else if (pid) unknown.add(pid);
  });
  if (unknown.size) console.warn('part_id sin entrada en SCHOOL.parts:', [...unknown]);

  // Límites del modelo
  const box = new THREE.Box3().setFromObject(root);
  if (!box.isEmpty()) {
    bounds.box.copy(box);
    const sphere = box.getBoundingSphere(new THREE.Sphere());
    bounds.radius = Math.max(0.05, sphere.radius * 0.92);
    bounds.center.copy(box.getCenter(new THREE.Vector3()));
    const terrain = state.partById.get('terreno');
    if (terrain && terrain.meshes.length) {
      const tb = new THREE.Box3(); terrain.meshes.forEach((m) => tb.expandByObject(m));
      bounds.groundY = tb.max.y;
    } else bounds.groundY = box.min.y + (box.max.y - box.min.y) * 0.08;
    bounds.center.y = THREE.MathUtils.lerp(bounds.groundY, box.max.y, 0.25);
  }
  shadowCatcher.position.set(bounds.center.x, box.min.y - 0.0005, bounds.center.z);
  shadowCatcher.scale.setScalar(bounds.radius * 2.4);
  shadowCatcher.visible = true;
  camera.near = bounds.radius * 0.02; camera.far = 60; camera.updateProjectionMatrix();
  placeSun();

  // Posición de etiquetas: positionGltf o centro superior de las mallas
  for (const part of state.parts) {
    if (part.pos) part.__labelPos = part.pos;
    else if (part.meshes.length) {
      const b = new THREE.Box3(); part.meshes.forEach((m) => b.expandByObject(m));
      part.__labelPos = new THREE.Vector3((b.min.x + b.max.x) / 2, b.max.y, (b.min.z + b.max.z) / 2);
    }
  }

  captureRestAnchors();
  setupAnimations(root, gltf.animations);
  state.modelReady = true;
  updateViewport();
  const { target, pos } = homePose();
  controls.target.copy(target); camera.position.copy(pos); controls.update();
  setStatus(null);
  const missing = state.parts.filter((p) => !p.meshes.length).length;
  announce('Escuela cargada. ' + state.parts.length + ' partes' + (missing ? ', ' + missing + ' sin malla en el modelo.' : '.'));
  renderCard();
}

async function boot() {
  buildPartUI();
  setSpeed(1);
  setAutoSpin(false);
  setNight(false);
  updateViewport();
  { const { target, pos } = homePose(); controls.target.copy(target); camera.position.copy(pos); controls.update(); }
  startLoop();

  if (!DATA) {
    setStatus('Modelo no disponible', 'No se recibieron datos de la escuela (window.SCHOOL).', true);
    return;
  }
  if (typeof DATA.glb !== 'string' || !DATA.glb) {
    setStatus('Modelo no disponible', state.parts.length
      ? 'Puedes leer las partes en la lista, pero el modelo 3D no está incluido.'
      : 'Los datos no incluyen el modelo 3D.', true);
    return;
  }
  setStatus('Cargando la escuela…', 'Preparando el modelo 3D.');
  try {
    const loader = new GLTFLoader();
    const gltf = DATA.glb.startsWith('data:')
      ? await loader.parseAsync(dataUriToArrayBuffer(DATA.glb), '')
      : await loader.loadAsync(DATA.glb);
    onModel(gltf);
  } catch (err) {
    console.error(err);
    setStatus('Modelo no disponible', 'No se pudo leer el modelo 3D (' + (err && err.message ? err.message : 'error desconocido') + ').', true);
  }
}
// Gancho de inspección (solo lectura) para QA automatizada.
window.__school = { state, camera, controls, view, bounds, actions, get frames() { return frames; } };
boot();
</script>
