name: Validate gallery and Studio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate JavaScript
        run: |
          node --check gallery/app.js
          node --check gallery/lab.js
          node --test tests/gallery_selection.test.cjs
      - name: Test reference rights and family preservation
        run: python -m unittest discover -s tools -p test_reference_policies.py -v
      - name: Build static site
        run: python tools/build_site.py
      - name: Verify models, credits, thumbnails and publication paths
        run: python tools/check_site.py
      - name: Verify vendored sources
        run: python creation-lab/registry/verify_sources.py
      - name: Check skill entrypoints and local references
        run: python tools/check_skills.py
      - name: Test creation contracts without Blender
        run: |
          python creation-lab/iterate.py --help
          python -m unittest discover -s creation-lab/tests -v
      - name: Test Blender web bridge contracts without Blender
        run: |
          python procedural-web/pw.py --help
          node --check procedural-web/node/sample_poses.mjs
          node --check procedural-web/tests/joints_three.mjs
          python -m unittest discover -s procedural-web/tests -v
      - name: Verify preserved Claude and school benchmark evidence
        run: |
          python creation-lab/benchmarks/claude-animal-cell/restore.py --check
          python creation-lab/benchmarks/school-flat-20261023/restore.py --check
      - name: Test rigging contracts without GPU
        run: python -m unittest discover -s lab/tests -v
      - name: Test portable educational benchmark
        run: |
          node --check creation-lab/benchmarks/animal-cell-20261022/viewer.js
          node --check creation-lab/benchmarks/animal-cell-20261022/validate.cjs
          python creation-lab/benchmarks/animal-cell-20261022/restore.py --check
          python -m unittest discover -s creation-lab/benchmarks/animal-cell-20261022 -p 'test*.py' -v
      - name: Restore benchmark evidence and validate GLBs
        run: |
          npm ci --prefix creation-lab/benchmarks/animal-cell-20261022 --ignore-scripts --no-audit --no-fund
          python creation-lab/benchmarks/animal-cell-20261022/restore.py
          node creation-lab/benchmarks/animal-cell-20261022/validate.cjs
      - name: Test Studio contracts and provider/engine adapters without paid APIs or GPU
        run: |
          python studio/studio.py --help
          python -m unittest discover -s studio/tests -v
      - name: Install pinned Studio preview dependencies
        run: npm ci --prefix studio/web --no-audit --no-fund
      - name: Verify Studio runtime and production build
        run: |
          npm run typecheck --prefix studio/web
          npm test --prefix studio/web
          npm run build --prefix studio/web
      - name: Install Chromium for Studio functional checks
        working-directory: studio/web
        run: npx playwright install --with-deps chromium
      - name: Test Studio browser interaction and animation
        run: npm run test:browser --prefix studio/web
      - name: Confirm Studio remains excluded from public gallery
        run: python tools/check_site.py
