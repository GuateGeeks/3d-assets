name: Validate gallery
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate JavaScript
        run: |
          node --check gallery/app.js
          node --check gallery/lab.js
      - name: Build static site
        run: python tools/build_site.py
      - name: Verify models, credits, thumbnails and publication paths
        run: python tools/check_site.py
      - name: Verify vendored sources
        run: python creation-lab/registry/verify_sources.py
      - name: Test creation contracts without Blender
        run: python -m unittest discover -s creation-lab/tests -v
      - name: Test rigging contracts without GPU
        run: python -m unittest discover -s lab/tests -v
